[package]
name = "nex-plus-fashion"
version = "0.1.0"
description = "NEX+ Fashion local-first desktop core"
authors = ["NEX+ Fashion"]
edition = "2021"

[lib]
name = "nex_plus_fashion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
tauri = { version = "2", features = [] }
